name: Deploy documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision-date-localized
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -e . mkdocs-material "mkdocstrings[python]" mkdocs-redirects mkdocs-git-revision-date-localized-plugin
      - run: mkdocs gh-deploy --force
